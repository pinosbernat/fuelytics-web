# Sitio público de Fueltic.
#
# Existe por una razón concreta: Google Play exige una **URL pública** donde el usuario pueda
# solicitar el borrado de su cuenta sin instalar la app. Sin eso no se puede publicar.
#
# GitHub Pages renderiza Markdown de forma nativa con Jekyll, así que no hay build ni
# dependencias: los .md de esta carpeta son el sitio. Ver `docs/RELEASE.md`.

title: Fueltic
description: Registra tus repostajes y descubre el consumo real de tu coche.
lang: es

# 🔴 Sin esto, Jekyll construye las canónicas y los `og:url` con el esquema que le da GitHub, que
# es `http://`. El resultado era que la política de privacidad y la página de borrado de cuenta
# —las dos que Google exige— se anunciaban a sí mismas en claro y así las indexaba el buscador.
url: https://fueltic.com

theme: jekyll-theme-minimal

# 🔴 **Sin esto, las cuatro páginas enseñan «View the Project on GitHub · pinosbernat/fuelytics-web».**
#
# `jekyll-theme-minimal` pinta ese bloque cuando `site.github.is_project_page` es cierto, y lo rellena
# con los datos que la API de GitHub le da del repositorio — que conserva el nombre viejo, porque el
# repositorio no se renombró con la app. Resultado: **la marca muerta, en la barra lateral de la
# página que abre un invitado**, y un enlace al código desde la política de privacidad que Google
# tiene registrada. Se apaga declarándolo en la configuración, que gana sobre lo que trae la API.
github:
  is_project_page: false

# Sin analítica y sin cookies: el sitio no necesita ninguna de las dos y así no hay que pedir
# consentimiento ni declarar nada. Tampoco se declaran plugins: se usan los que GitHub Pages
# activa por defecto.

exclude:
  - README.md
